name: Desktop Build

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/desktop_build.yml
      - apps/daemon/**
      - apps/desktop/**
      - apps/web/**
      - packages/bridge/**
      - packages/components/**
      - packages/core/**
      - packages/frontend-plugin/**
      - packages/plugin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - .github/workflows/desktop_build.yml
      - apps/daemon/**
      - apps/desktop/**
      - apps/web/**
      - packages/bridge/**
      - packages/components/**
      - packages/core/**
      - packages/frontend-plugin/**
      - packages/plugin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  build:
    name: Build Desktop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elsewise/desktop check
      - run: pnpm --filter @elsewise/desktop typecheck
      - run: pnpm --filter @elsewise/desktop test
      # Ubuntu blocks the unprivileged user namespaces that Electron's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @elsewise/desktop test:electron
      - if: runner.os != 'Linux'
        run: pnpm --filter @elsewise/desktop test:electron
      - run: pnpm --filter @elsewise/desktop build
