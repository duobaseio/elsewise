name: Transport TS Build

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/transport_ts_build.yaml
      - packages/transport/ts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - proto/**
  pull_request:
    paths:
      - .github/workflows/transport_ts_build.yaml
      - packages/transport/ts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - proto/**

permissions:
  contents: read

jobs:
  test:
    name: Test Transport TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elsewise/transport check
      - run: pnpm --filter @elsewise/transport typecheck
      - run: pnpm --filter @elsewise/transport test
