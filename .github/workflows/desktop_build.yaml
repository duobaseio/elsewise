name: Desktop Build

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/desktop_build.yaml
      - apps/desktop/**
      - apps/web/**
      - packages/bridge/**
      - packages/components/**
      - packages/core/**
      - packages/plugin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - .github/workflows/desktop_build.yaml
      - apps/desktop/**
      - apps/web/**
      - packages/bridge/**
      - packages/components/**
      - packages/core/**
      - packages/plugin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  build:
    name: Build Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elsewise/desktop check
      - run: pnpm --filter @elsewise/desktop typecheck
      - run: pnpm --filter @elsewise/desktop test
      - run: pnpm --filter @elsewise/desktop build
