name: CLI Build

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/cli_build.yml
      - apps/cli/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - .github/workflows/cli_build.yml
      - apps/cli/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  build:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elsewise/cli check
      - run: pnpm --filter @elsewise/cli typecheck
      - run: pnpm --filter @elsewise/cli test
      - run: pnpm --filter @elsewise/cli build
