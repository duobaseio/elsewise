packages:
  - "apps/*"
  - "packages/*"
  - "packages/transport/ts"
  - "plugins/examples/*"

allowBuilds:
  # buf's postinstall selects/links the platform CLI binary.
  '@bufbuild/buf': true
  # electron-builder 26 drags in the squirrel target's toolchain. This repo ships nsis
  # on Windows, so its 7-Zip selection never runs.
  electron-winstaller: false
  # esbuild's postinstall checks the platform binary its optional dependency installs, and
  # swaps it in for the CLI's JS shim. The JS API, which apps/desktop uses, doesn't need it.
  esbuild: false
